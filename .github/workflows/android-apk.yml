name: android-apk

# Builds an installable WiredGram APK (debug-signed) from the Vite app in
# `wiredgram/`, wrapped by Capacitor:
#   1. npm ci + tsc + vite build           → wiredgram/dist
#   2. npx cap sync android                → copies dist into the Android project
#   3. ./gradlew assembleDebug             → app-debug.apk
#   4. upload the APK as an artifact

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "wiredgram/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: wiredgram-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wiredgram

    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
      WG_VERSION_CODE: ${{ github.run_number }}
      WG_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.0-nightly.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wiredgram/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::warning::sdkmanager not found — relying on the runner image SDK"
            exit 0
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            || echo "::warning::Could not install Android SDK packages; Gradle will report what is missing"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: wiredgram/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: wiredgram/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/gradle-build.log

      - name: Report Gradle failure
        if: failure()
        shell: bash
        run: |
          LOG=/tmp/gradle-build.log
          [ -f "$LOG" ] || exit 0
          REASON=$(grep -A 14 -i "what went wrong" "$LOG" | tr '\n' ' ' | sed 's/[[:space:]]\{1,\}/ /g' | cut -c1-900)
          [ -n "$REASON" ] || REASON=$(tail -40 "$LOG" | tr '\n' ' ' | sed 's/[[:space:]]\{1,\}/ /g' | cut -c1-900)
          echo "::error title=Gradle error::${REASON}"
          echo "Gradle error: ${REASON}" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          SAFE="${WG_VERSION_NAME//\//-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/WiredGram-${SAFE}.apk"
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wiredgram-apk
          path: wiredgram/artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### WiredGram APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${WG_VERSION_NAME}\` |"
            echo "| Version code | \`${WG_VERSION_CODE}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo "Installable debug-signed APK: artifact **wiredgram-apk**."
          } >> "$GITHUB_STEP_SUMMARY"
