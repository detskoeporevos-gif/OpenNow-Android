name: android-build

# Builds the Android APKs (debug + release) for OpenNOW.
#
# Pipeline:
#   1. install JS deps            (Electron binary download is skipped)
#   2. npm run build              -> dist/  (web bundle)
#   3. npx cap sync android       -> copies dist/ into android/app/src/main/assets
#   4. gradlew assembleDebug / assembleRelease
#   5. upload APKs, and publish them on a GitHub release for tags

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build the release APK"
        type: boolean
        default: true

  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
      - "android-v*"
    paths:
      - "opennow-stable/**"
      - ".github/workflows/android-build.yml"

  pull_request:
    paths:
      - "opennow-stable/**"
      - ".github/workflows/android-build.yml"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    # Pinned instead of ubuntu-latest so the preinstalled Android SDK path and
    # JDK stay predictable across runner image migrations.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: opennow-stable

    env:
      # Electron's postinstall downloads a ~100 MB binary we never use here.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
      # Resolved version metadata, overridable per run.
      OPENNOW_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-nightly.{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub-hosted Ubuntu image already ships the Android SDK; just make
      # sure the right platform/build-tools are present and expose the paths.
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "sdkmanager not found -- relying on the SDK bundled with the runner image"
            exit 0
          fi

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            || echo "::warning::Could not install Android SDK packages; Gradle will report what is missing"

      - name: Setup Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install JS dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck
        continue-on-error: true

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor project
        run: npx cap sync android

      # Secrets can't be used in `if:` conditions, so the step no-ops when the
      # secret is absent and the release APK is simply left unsigned.
      - name: Restore release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret -- the release APK will be unsigned."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Make gradlew executable
        working-directory: opennow-stable/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: opennow-stable/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain \
            -PopenNowVersionCode=${{ github.run_number }} \
            -PopenNowVersionName="${{ env.OPENNOW_VERSION_NAME }}" \
            2>&1 | tee /tmp/gradle-debug.log

      - name: Build release APK
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_release) }}
        working-directory: opennow-stable/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PopenNowVersionCode=${{ github.run_number }} \
            -PopenNowVersionName="${{ env.OPENNOW_VERSION_NAME }}" \
            2>&1 | tee /tmp/gradle-release.log

      # Surfaces the Gradle error as an annotation, which is readable from the
      # API and the run summary instead of digging through megabytes of log.
      - name: Report Gradle failure
        if: failure()
        shell: bash
        run: |
          LOG=$(ls -t /tmp/gradle-*.log 2>/dev/null | head -1)
          if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then
            echo "::error title=Build failed::No gradle log was produced."
            exit 0
          fi
          REASON=$(grep -A 14 -i "what went wrong" "$LOG" | tr '\n' ' ' | sed 's/[[:space:]]\{1,\}/ /g' | cut -c1-900)
          if [ -z "$REASON" ]; then
            REASON=$(tail -40 "$LOG" | tr '\n' ' ' | sed 's/[[:space:]]\{1,\}/ /g' | cut -c1-900)
          fi
          echo "::error title=Gradle error::${REASON}"
          echo "Gradle error: ${REASON}" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          SAFE="${OPENNOW_VERSION_NAME//\//-}"
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk \
               "artifacts/OpenNOW-${SAFE}-debug.apk"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               "artifacts/OpenNOW-${SAFE}-release.apk"
          fi
          ls -lh artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennow-android-apk
          path: opennow-stable/artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "### OpenNOW Android build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${OPENNOW_VERSION_NAME}\` |"
            echo "| Version code | \`${GITHUB_RUN_NUMBER}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo "APKs are attached to this run as the \`opennow-android-apk\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: opennow-android-apk
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('OpenNOW Android {0}', github.ref_name) }}
          generate_release_notes: true
          files: release-artifacts/*.apk
