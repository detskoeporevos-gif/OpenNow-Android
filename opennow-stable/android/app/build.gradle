// ── Release signing ───────────────────────────────────────────────────────
// keystore.properties lives in android/ and is never committed. When it is
// absent (CI, fresh clones) the release build simply stays unsigned instead of
// failing at configuration time.
// Values can also come from environment variables, which is what the GitHub
// Actions workflow uses (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD,
// RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
["RELEASE_STORE_FILE", "RELEASE_STORE_PASSWORD", "RELEASE_KEY_ALIAS", "RELEASE_KEY_PASSWORD"].each { key ->
    def envValue = System.getenv(key)
    if (envValue != null && !envValue.isEmpty() && !keystoreProperties.containsKey(key)) {
        keystoreProperties.setProperty(key, envValue)
    }
}
def signingStoreFile = keystoreProperties.getProperty("RELEASE_STORE_FILE")
def hasReleaseSigning = signingStoreFile != null &&
        !signingStoreFile.isEmpty() &&
        file(signingStoreFile).exists()

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.zortos.opennow"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zortos.opennow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Override from the command line in CI: -PopenNowVersionCode=42 -PopenNowVersionName=0.4.0
        versionCode project.hasProperty("openNowVersionCode") ? project.property("openNowVersionCode").toInteger() : 1
        versionName project.hasProperty("openNowVersionName") ? project.property("openNowVersionName").toString() : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStoreFile)
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // Required by GfnPlugin.kt and AndroidSignalingManager.kt
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.android.volley:volley:1.2.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
